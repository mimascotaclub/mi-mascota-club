<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mi Mascota Club — Registro</title>

<style>
  :root{
    --amarillo:#FFCE00;
    --turquesa:#47C9C9;
    --negro:#151515;
    --blanco:#FFFFFF;
    --gris-suave:#F7F7F5;
    --gris-linea:#E4E2DC;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0;
    font-family:'Lato',sans-serif;
    background:var(--negro);
    color:var(--negro);
    overflow:hidden;
  }

  /* ---------- Barra de progreso ---------- */
  .progreso-wrap{
    position:fixed; top:0; left:0; right:0; height:4px;
    background:rgba(255,255,255,0.08); z-index:50;
  }
  .progreso-bar{
    height:100%; width:0%;
    background:var(--amarillo);
    transition:width .45s cubic-bezier(.65,0,.35,1);
  }
  .progreso-texto{
    position:fixed; top:18px; right:24px; z-index:50;
    font-size:13px; font-weight:700; letter-spacing:.04em;
    color:rgba(255,255,255,0.55);
  }
  .btn-volver{
    position:fixed; top:14px; left:20px; z-index:50;
    background:none; border:none; color:rgba(255,255,255,0.55);
    font-family:'Lato',sans-serif; font-weight:700; font-size:14px;
    cursor:pointer; display:flex; align-items:center; gap:6px;
    padding:8px; opacity:0; transition:opacity .3s;
  }
  .btn-volver.visible{opacity:1;}
  .btn-volver:hover{color:var(--blanco);}

  /* ---------- Escenario de pasos ---------- */
  .stage{
    position:relative; height:100vh; width:100vw;
    background:var(--negro);
  }
  .paso{
    position:absolute; inset:0;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    padding:32px 24px;
    opacity:0; pointer-events:none;
    transform:translateX(40px);
    transition:opacity .45s cubic-bezier(.65,0,.35,1), transform .45s cubic-bezier(.65,0,.35,1);
  }
  .paso.activo{
    opacity:1; pointer-events:auto; transform:translateX(0);
  }
  .paso.saliendo{
    opacity:0; transform:translateX(-40px);
  }

  .paso-inner{ width:100%; max-width:520px; }

  .eyebrow{
    color:var(--turquesa); font-weight:900; font-size:13px;
    letter-spacing:.12em; text-transform:uppercase; margin:0 0 14px;
  }
  .pregunta{
    color:var(--blanco); font-size:clamp(24px,4.2vw,38px); font-weight:900;
    line-height:1.15; margin:0 0 28px;
  }
  .pregunta .pet-name{ color:var(--amarillo); }

  input[type=text], input[type=email]{
    width:100%; background:transparent; border:none;
    border-bottom:2px solid rgba(255,255,255,0.25);
    color:var(--blanco); font-family:'Lato',sans-serif;
    font-size:clamp(20px,3vw,28px); font-weight:700;
    padding:10px 2px 14px; outline:none;
    transition:border-color .25s;
  }
  input::placeholder{ color:rgba(255,255,255,0.3); font-weight:400; }
  input:focus{ border-bottom-color:var(--amarillo); }

  .hint{ color:rgba(255,255,255,0.4); font-size:14px; margin-top:10px; }

  /* ---------- Opciones tipo tarjeta (especie) ---------- */
  .opciones-grid{
    display:grid; grid-template-columns:1fr 1fr; gap:14px; margin-top:6px;
  }
  .opcion-card{
    background:rgba(255,255,255,0.04);
    border:2px solid rgba(255,255,255,0.12);
    border-radius:16px; padding:24px 16px; text-align:center;
    cursor:pointer; transition:all .2s;
    display:flex; flex-direction:column; align-items:center; gap:10px;
  }
  .opcion-card .emoji{ font-size:34px; }
  .opcion-card span.label{ color:var(--blanco); font-weight:700; font-size:16px; }
  .opcion-card:hover{ border-color:var(--turquesa); transform:translateY(-2px); }
  .opcion-card.selected{ border-color:var(--amarillo); background:rgba(255,206,0,0.08); }

  /* ---------- Select estilizado + buscador ---------- */
  .select-wrap{ position:relative; }
  .select-fake{
    width:100%; background:rgba(255,255,255,0.04);
    border:2px solid rgba(255,255,255,0.15); border-radius:12px;
    padding:16px 18px; color:var(--blanco); font-size:18px; font-weight:700;
    cursor:pointer; display:flex; justify-content:space-between; align-items:center;
    transition:border-color .2s;
  }
  .select-fake:hover, .select-fake.abierto{ border-color:var(--turquesa); }
  .select-fake .chevron{ color:var(--turquesa); transition:transform .2s; }
  .select-fake.abierto .chevron{ transform:rotate(180deg); }

  .dropdown-panel{
    position:absolute; top:calc(100% + 8px); left:0; right:0;
    background:#1E1E1E; border:1px solid rgba(255,255,255,0.12);
    border-radius:12px; max-height:280px; overflow:hidden;
    display:none; flex-direction:column; z-index:20;
    box-shadow:0 20px 40px rgba(0,0,0,0.4);
  }
  .dropdown-panel.abierto{ display:flex; }
  .dropdown-search{
    padding:10px; border-bottom:1px solid rgba(255,255,255,0.08);
  }
  .dropdown-search input{
    border-bottom:none; font-size:15px; font-weight:400;
    background:rgba(255,255,255,0.05); border-radius:8px; padding:10px 12px;
  }
  .dropdown-list{ overflow-y:auto; padding:6px; }
  .dropdown-item{
    padding:11px 12px; color:var(--blanco); font-size:15px;
    border-radius:8px; cursor:pointer;
  }
  .dropdown-item:hover, .dropdown-item.hl{ background:rgba(255,206,0,0.12); color:var(--amarillo); }

  /* ---------- Botón continuar ---------- */
  .btn-continuar{
    margin-top:32px; background:var(--amarillo); color:var(--negro);
    border:none; border-radius:100px; padding:16px 34px;
    font-family:'Lato',sans-serif; font-weight:900; font-size:16px;
    cursor:pointer; display:inline-flex; align-items:center; gap:10px;
    transition:transform .15s, box-shadow .15s;
    opacity:.4; pointer-events:none;
  }
  .btn-continuar.activo{ opacity:1; pointer-events:auto; }
  .btn-continuar:hover{ transform:translateY(-2px); box-shadow:0 10px 24px rgba(255,206,0,0.25); }
  .btn-continuar:active{ transform:translateY(0); }
  .tecla-enter{
    font-size:11px; background:rgba(0,0,0,0.15); padding:3px 7px;
    border-radius:5px; font-weight:700;
  }

  /* ---------- Pantalla final ---------- */
  .final-check{
    width:84px; height:84px; border-radius:50%;
    background:var(--turquesa); display:flex; align-items:center; justify-content:center;
    margin:0 auto 24px; animation:pop .5s cubic-bezier(.34,1.56,.64,1);
  }
  @keyframes pop{ from{ transform:scale(0); } to{ transform:scale(1); } }
  .final-check svg{ width:40px; height:40px; }
  .resumen{
    background:rgba(255,255,255,0.04); border-radius:14px; padding:18px 20px;
    margin-top:22px; text-align:left;
  }
  .resumen-row{ display:flex; justify-content:space-between; padding:7px 0; font-size:14px;
    border-bottom:1px solid rgba(255,255,255,0.06); color:rgba(255,255,255,0.8); }
  .resumen-row:last-child{ border-bottom:none; }
  .resumen-row b{ color:var(--blanco); }

  /* ---------- Casillas de código (estilo GitHub) ---------- */
  .codigo-boxes{ display:flex; gap:10px; margin-top:8px; }
  .codigo-box{
    width:52px; height:60px; text-align:center;
    font-size:26px; font-weight:900; color:var(--blanco);
    background:rgba(255,255,255,0.04); border:2px solid rgba(255,255,255,0.18);
    border-radius:10px; outline:none; transition:border-color .2s, transform .15s;
  }
  .codigo-box:focus{ border-color:var(--amarillo); transform:translateY(-2px); }
  .codigo-box.error{ border-color:#FF5C5C; animation:shake .35s; }
  @keyframes shake{ 0%,100%{transform:translateX(0);} 25%{transform:translateX(-6px);} 75%{transform:translateX(6px);} }
  .codigo-estado{ margin-top:14px; font-size:14px; min-height:20px; }
  .codigo-estado.ok{ color:var(--turquesa); }
  .codigo-estado.err{ color:#FF7A7A; }
  .reenviar-link{ background:none; border:none; color:var(--turquesa); font-weight:700;
    font-family:'Lato',sans-serif; font-size:14px; cursor:pointer; padding:0; text-decoration:underline; }
  .reenviar-link:disabled{ color:rgba(255,255,255,0.3); cursor:default; text-decoration:none; }
  .spinner{
    width:18px; height:18px; border:2.5px solid rgba(255,255,255,0.2);
    border-top-color:var(--amarillo); border-radius:50%; animation:girar .7s linear infinite;
    display:inline-block; vertical-align:middle; margin-right:8px;
  }
  @keyframes girar{ to{ transform:rotate(360deg); } }

  /* ---------- Tarjetas de plan ---------- */
  .planes-grid{ display:flex; flex-direction:column; gap:14px; margin-top:6px; }
  .plan-card{
    background:rgba(255,255,255,0.04); border:2px solid rgba(255,255,255,0.12);
    border-radius:16px; padding:20px 22px; cursor:pointer; transition:all .2s;
    display:flex; justify-content:space-between; align-items:center;
  }
  .plan-card:hover{ border-color:var(--turquesa); }
  .plan-card.selected{ border-color:var(--amarillo); background:rgba(255,206,0,0.07); }
  .plan-nombre{ color:var(--blanco); font-weight:900; font-size:17px; }
  .plan-desc{ color:rgba(255,255,255,0.5); font-size:13px; margin-top:4px; }
  .plan-precio{ color:var(--amarillo); font-weight:900; font-size:18px; white-space:nowrap; }

  .hint.ok{ color:var(--turquesa); }

  /* ---------- Mascota animada (paso del código) ---------- */
  .mascota-wrap{ display:flex; justify-content:center; margin-bottom:22px; }
  .mascota-svg{ width:100px; height:100px; }
  .pata{ transition: transform .35s cubic-bezier(.34,1.2,.64,1); }
  .pata-izq{ transform-origin: 38px 78px; }
  .pata-der{ transform-origin: 62px 78px; }
  .mascota-tapada .pata-izq{ transform: translate(4px,-34px) rotate(-8deg); }
  .mascota-tapada .pata-der{ transform: translate(-4px,-34px) rotate(8deg); }
  .mascota-espiando .pata-izq{ transform: translate(4px,-26px) rotate(-14deg); }
  .mascota-espiando .pata-der{ transform: translate(10px,-30px) rotate(20deg); }

  /* ---------- Botón ir al inicio ---------- */
  .btn-ir-inicio{
    margin-top: 18px; background: transparent; color: var(--turquesa);
    border: 2px solid var(--turquesa); border-radius: 100px; padding: 14px 30px;
    font-family:'Lato',sans-serif; font-weight:900; font-size:15px; cursor:pointer;
    transition: all .2s; text-decoration:none; display:inline-block;
  }
  .btn-ir-inicio:hover{ background: var(--turquesa); color:var(--negro); }

  @media (prefers-reduced-motion: reduce){
    .paso, .progreso-bar, .final-check{ transition:none !important; animation:none !important; }
  }
</style>
</head>

/* ============================================================
   MI MASCOTA CLUB — FORMULARIO PASO A PASO (demo integrable)

const RAZAS_PERRO = ["Mestizo/No sé","Akita","Basset Hound","Beagle","Bichón Frisé","Border Collie","Boxer","Bull Terrier","Bulldog Francés","Cane Corso","Chihuahua","Chow Chow","Cocker Spaniel","Collie","Dachshund (Salchicha)","Dálmata","Doberman","Dogo Argentino","Fox Terrier","Galgo","Golden Retriever","Gran Danés","Husky Siberiano","Jack Russell Terrier","Labrador Retriever","Maltés","Mastín","Pastor Alemán","Pastor Belga","Pekinés","Pit Bull Terrier","Pointer","Poodle","Pug","Rottweiler","Samoyedo","San Bernardo","Schnauzer","Setter Irlandés","Shih Tzu","Weimaraner","West Highland Terrier","Whippet","Yorkshire Terrier","Otra raza"];
const RAZAS_GATO = ["Mestizo/No sé","Abisinio","Angora Turco","Azul Ruso","Bengalí","Bombay","British Shorthair","Común Europeo","Exótico de Pelo Corto","Himalayo","Maine Coon","Manx","Persa","Ragdoll","Scottish Fold","Siamés","Sphynx (sin pelo)","Otra raza"];

function validarRut(rutCompleto){
  rutCompleto = rutCompleto.replace(/\./g,'').replace(/-/g,'').trim();
  if(rutCompleto.length < 2) return false;
  const cuerpo = rutCompleto.slice(0,-1);
  let dv = rutCompleto.slice(-1).toUpperCase();
  if(!/^\d+$/.test(cuerpo)) return false;
  if(/^(\d)\1*$/.test(cuerpo)) return false; // rechaza 000000, 111111, 22222222, etc.
  if(cuerpo.length < 7) return false; // RUTs reales en Chile parten en 7 dígitos como mínimo
  let suma = 0, multiplo = 2;
  for(let i = cuerpo.length - 1; i >= 0; i--){
    suma += parseInt(cuerpo[i]) * multiplo;
    multiplo = multiplo === 7 ? 2 : multiplo + 1;
  }
  const resto = 11 - (suma % 11);
  const dvEsperado = resto === 11 ? '0' : resto === 10 ? 'K' : resto.toString();
  return dv === dvEsperado;
}
function formatearRut(valor){
  valor = valor.replace(/[^0-9kK]/g,'');
  if(valor.length <= 1) return valor;
  const cuerpo = valor.slice(0,-1);
  const dv = valor.slice(-1).toUpperCase();
  return cuerpo.replace(/\B(?=(\d{3})+(?!\d))/g,'.') + '-' + dv;
}

const preguntas = [
  { id:"nombre", tipo:"texto", eyebrow:"Empecemos", pregunta:"¿Cuál es tu nombre completo?", placeholder:"Ej: Jaime Florian" },
  { id:"mascota", tipo:"texto", eyebrow:"Ahora tu compañero/a", pregunta:"¿Cómo se llama tu mascota?", placeholder:"Ej: Olivia" },

  { id:"tamano", tipo:"select", eyebrow:"Última de {mascota}", pregunta:"¿Cómo describirías su tamaño?",

  { id:"rut", tipo:"rut", eyebrow:"Sobre ti", pregunta:"¿Cuál es tu RUT?", placeholder:"12.345.678-9" },
  { id:"correo", tipo:"email", eyebrow:"Verifiquemos tu correo", pregunta:"¿A qué correo te enviamos tu carnet?", placeholder:"tucorreo@ejemplo.com" },
  { id:"codigo", tipo:"codigo", eyebrow:"Confirma que eres tú", pregunta:"Ingresa el código" },
  { id:"plan", tipo:"plan", eyebrow:"Último paso", pregunta:"Elige tu plan" },
];

const respuestas = {};
let pasoActual = 0;
const stage = document.getElementById('stage');
const progresoBar = document.getElementById('progresoBar');
const progresoTexto = document.getElementById('progresoTexto');
const btnVolver = document.getElementById('btnVolver');

function interpolar(str){
  return str.replace('{mascota}', respuestas.mascota || 'tu mascota');
}

function razasSegunEspecie(){
  if(respuestas.especie === 'gato') return RAZAS_GATO;
  return RAZAS_PERRO; // default perro/otro
}

function renderPaso(index, direccion){
  const q = preguntas[index];
  const div = document.createElement('div');
  div.className = 'paso';
  div.dataset.id = q.id;

  let camposHtml = '';

  if(q.tipo === 'rut'){
    camposHtml = `
      <input type="text" id="campo-${q.id}" placeholder="${q.placeholder}" autocomplete="off" value="${respuestas[q.id]||''}" maxlength="12">
      <div class="hint" id="rutHint">Presiona Enter para continuar</div>
    `;
  }

  if(q.tipo === 'texto' || q.tipo === 'email'){
    camposHtml = `
      <input type="${q.tipo==='email'?'email':'text'}" id="campo-${q.id}" placeholder="${q.placeholder}" autocomplete="off" value="${respuestas[q.id]||''}">
      <div class="hint">Presiona Enter para continuar</div>
    `;
  }

  if(q.tipo === 'opciones'){
    camposHtml = `<div class="opciones-grid">` + q.opciones.map(op => `
      <div class="opcion-card ${respuestas[q.id]===op.value?'selected':''}" data-value="${op.value}">
        <span class="emoji">${op.emoji}</span><span class="label">${op.label}</span>
      </div>`).join('') + `</div>`;
  }

  if(q.tipo === 'select'){
    camposHtml = `
      <div class="select-wrap">
        <div class="select-fake" id="selectFake-${q.id}">
          <span id="selectLabel-${q.id}">${respuestas[q.id] || 'Selecciona una opción'}</span>

        <div class="dropdown-panel" id="dropdown-${q.id}">

            ${q.opciones.map(op => `<div class="dropdown-item" data-value="${op}">${op}</div>`).join('')}
          </div>
        </div>

  if(q.tipo === 'codigo'){
    camposHtml = `
      <div class="mascota-wrap">
        <svg class="mascota-svg" id="mascotaSvg" viewBox="0 0 100 100">
          <ellipse cx="50" cy="55" rx="34" ry="30" fill="#FFCE00"/>
          <ellipse cx="20" cy="30" rx="12" ry="16" fill="#FFCE00" transform="rotate(-25 20 30)"/>
          <ellipse cx="80" cy="30" rx="12" ry="16" fill="#FFCE00" transform="rotate(25 80 30)"/>
          <circle cx="38" cy="50" r="5" fill="#151515"/>
          <circle cx="62" cy="50" r="5" fill="#151515"/>
          <ellipse cx="50" cy="66" rx="6" ry="4" fill="#47C9C9"/>
          <path d="M42 74 Q50 80 58 74" stroke="#151515" stroke-width="2" fill="none" stroke-linecap="round"/>
          <g class="pata pata-izq"><ellipse cx="38" cy="80" rx="10" ry="12" fill="#FFCE00"/></g>
          <g class="pata pata-der"><ellipse cx="62" cy="80" rx="10" ry="12" fill="#FFCE00"/></g>
        </svg>
      </div>
      <p style="color:rgba(255,255,255,0.55); font-size:15px; margin:-10px 0 18px; text-align:center;">

      </div>
    `;
  }

  if(q.tipo === 'plan'){
    camposHtml = `<div class="planes-grid">
      <div class="plan-card selected" data-plan="free">
        <div><div class="plan-nombre">Free</div><div class="plan-desc">Directorio, carnet digital y descuentos base</div></div>

      </div>
      <div class="plan-card" data-plan="pro">
        <div><div class="plan-nombre">Pro</div><div class="plan-desc">Incluye calificar negocios y ver reputación</div></div>
        <div class="plan-precio">$2.990/mes</div>
      </div>
      <div class="plan-card" data-plan="premium">
        <div><div class="plan-nombre">Premium</div><div class="plan-desc">Todo lo anterior + beneficios exclusivos</div></div>

  if(q.tipo === 'select-buscable'){

    camposHtml = `

  div.innerHTML = `
    <div class="paso-inner">
      <p class="eyebrow">${q.eyebrow ? interpolar(q.eyebrow) : ''}</p>
      <h1 class="pregunta">${interpolar(q.pregunta).replace(respuestas.mascota||'§§§', `<span class="pet-name">${respuestas.mascota||''}</span>`)}</h1>
      ${camposHtml}
      <button class="btn-continuar" id="btnContinuar">Continuar <span class="tecla-enter">↵</span></button>
    </div>
  `;

  stage.appendChild(div);
  requestAnimationFrame(()=> div.classList.add('activo'));

  // ---- lógica según tipo ----
  if(q.tipo === 'rut'){
    const input = div.querySelector('input');
    const hint = div.querySelector('#rutHint');
    const btn = div.querySelector('#btnContinuar');
    setTimeout(()=> input.focus(), 250);
    function validar(){
      const formateado = formatearRut(input.value);
      input.value = formateado;
      const esValido = validarRut(formateado);
      if(input.value.length >= 3 && !esValido){
        hint.textContent = 'RUT inválido — revisa el dígito verificador';
        hint.className = 'hint';
        hint.style.color = '#FF7A7A';
      } else if(esValido){
        hint.textContent = '✓ RUT válido';
        hint.className = 'hint ok';
        hint.style.color = '';
      } else {
        hint.textContent = 'Presiona Enter para continuar';
        hint.className = 'hint';
        hint.style.color = '';
      }
      btn.classList.toggle('activo', esValido);
      respuestas[q.id] = formateado;
    }
    input.addEventListener('input', validar);
    input.addEventListener('keydown', e=>{ if(e.key==='Enter' && btn.classList.contains('activo')) avanzar(); });
    validar();
    btn.addEventListener('click', ()=> btn.classList.contains('activo') && avanzar());
  }

  if(q.tipo === 'texto' || q.tipo === 'email'){
    const input = div.querySelector('input');
    const btn = div.querySelector('#btnContinuar');
    setTimeout(()=> input.focus(), 250);
    function validar(){
      const val = input.value.trim();
      const ok = q.tipo==='email' ? /\S+@\S+\.\S+/.test(val) : val.length>0;
      btn.classList.toggle('activo', ok);
      respuestas[q.id] = val;
    }
    input.addEventListener('input', validar);
    input.addEventListener('keydown', e=>{ if(e.key==='Enter' && btn.classList.contains('activo')) avanzar(); });
    validar();
    btn.addEventListener('click', ()=> btn.classList.contains('activo') && avanzar());
  }

  if(q.tipo === 'opciones'){
    const btn = div.querySelector('#btnContinuar');
    div.querySelectorAll('.opcion-card').forEach(card=>{
      card.addEventListener('click', ()=>{
        div.querySelectorAll('.opcion-card').forEach(c=>c.classList.remove('selected'));
        card.classList.add('selected');
        respuestas[q.id] = card.dataset.value;
        btn.classList.add('activo');
        setTimeout(avanzar, 350);
      });
    });
  }

  if(q.tipo === 'select' || q.tipo === 'select-buscable'){
    const fake = div.querySelector(`#selectFake-${q.id}`);
    const panel = div.querySelector(`#dropdown-${q.id}`);
    const label = div.querySelector(`#selectLabel-${q.id}`);
    const btn = div.querySelector('#btnContinuar');
    fake.addEventListener('click', ()=>{
      panel.classList.toggle('abierto');
      fake.classList.toggle('abierto');
    });
    panel.querySelectorAll('.dropdown-item').forEach(item=>{
      item.addEventListener('click', ()=>{
        respuestas[q.id] = item.dataset.value;
        label.textContent = item.dataset.value;
        panel.classList.remove('abierto');
        fake.classList.remove('abierto');
        btn.classList.add('activo');
        setTimeout(avanzar, 300);
      });
    });
    if(q.tipo === 'select-buscable'){
      const buscador = div.querySelector('#buscarRaza');
      buscador.addEventListener('input', ()=>{
        const term = buscador.value.toLowerCase();
        div.querySelectorAll('#listaRazas .dropdown-item').forEach(it=>{
          it.style.display = it.textContent.toLowerCase().includes(term) ? '' : 'none';
        });
      });
    }
    if(respuestas[q.id]) btn.classList.add('activo');
  }

  if(q.tipo === 'codigo'){
    const boxes = [...div.querySelectorAll('.codigo-box')];
    const estado = div.querySelector('#codigoEstado');
    const btnReenviar = div.querySelector('#btnReenviar');
    const btn = div.querySelector('#btnContinuar');
    const mascota = div.querySelector('#mascotaSvg');
    let espiandoInterval = null;

    function actualizarMascota(){
      const cantidad = boxes.filter(b=>b.value).length;
      if(cantidad === 0){
        mascota.classList.remove('mascota-tapada','mascota-espiando');
        clearInterval(espiandoInterval);
      } else {
        mascota.classList.add('mascota-tapada');
        if(!espiandoInterval){
          espiandoInterval = setInterval(()=>{
            mascota.classList.add('mascota-espiando');
            setTimeout(()=> mascota.classList.remove('mascota-espiando'), 400);
          }, 2200);
        }
      }
    }

    async function enviarCodigo(){
      estado.className = 'codigo-estado';
      estado.innerHTML = `<span class="spinner"></span> Enviando código...`;
      btnReenviar.disabled = true;
      try{
        const r = await fetch('/.netlify/functions/enviar-codigo', {
          method:'POST', headers:{'Content-Type':'application/json'},
          body: JSON.stringify({ email: respuestas.correo })
        });
        const data = await r.json();
        if(data.ok){
          estado.className = 'codigo-estado ok';
          estado.textContent = 'Código enviado. Revisa tu bandeja de entrada.';
        } else {
          estado.className = 'codigo-estado err';
          estado.textContent = data.mensaje || 'No se pudo enviar el código.';
        }
      } catch(e){
        estado.className = 'codigo-estado err';
        estado.textContent = 'Error de conexión. Intenta de nuevo.';
      }
      setTimeout(()=> btnReenviar.disabled = false, 20000);
    }

    enviarCodigo(); // se envía apenas se llega a este paso
    btnReenviar.addEventListener('click', enviarCodigo);

    boxes.forEach((box, i)=>{
      box.addEventListener('input', ()=>{
        box.value = box.value.replace(/[^0-9]/g,'');
        if(box.value && i < boxes.length-1) boxes[i+1].focus();
        chequearCompleto();
        actualizarMascota();
      });
      box.addEventListener('keydown', e=>{
        if(e.key==='Backspace' && !box.value && i>0) boxes[i-1].focus();
      });
      box.addEventListener('paste', e=>{
        e.preventDefault();
        const texto = (e.clipboardData.getData('text')||'').replace(/[^0-9]/g,'').slice(0,6);
        texto.split('').forEach((d,idx)=>{ if(boxes[idx]) boxes[idx].value = d; });
        boxes[Math.min(texto.length,6)-1]?.focus();
        chequearCompleto();
      });
    });

    async function chequearCompleto(){
      const codigo = boxes.map(b=>b.value).join('');
      if(codigo.length !== 6) return;
      estado.className = 'codigo-estado';
      estado.innerHTML = `<span class="spinner"></span> Verificando...`;
      try{
        const { data, error } = await window.supabase.rpc('verificar_codigo_email', {
          p_email: respuestas.correo, p_codigo: codigo
        });
        if(error || !data){
          estado.className = 'codigo-estado err';
          estado.textContent = 'Código incorrecto o vencido.';
          boxes.forEach(b=> b.classList.add('error'));
          setTimeout(()=> boxes.forEach(b=> b.classList.remove('error')), 400);
          return;
        }
        estado.className = 'codigo-estado ok';
        estado.textContent = '¡Correo verificado!';
        mascota.classList.remove('mascota-tapada','mascota-espiando');
        clearInterval(espiandoInterval);
        respuestas.correo_verificado = true;
        btn.classList.add('activo');
        setTimeout(avanzar, 500);
      } catch(e){
        estado.className = 'codigo-estado err';
        estado.textContent = 'Error de conexión al verificar.';
      }
    }
    setTimeout(()=> boxes[0].focus(), 300);
  }

  if(q.tipo === 'plan'){
    const btn = div.querySelector('#btnContinuar');
    respuestas.plan = respuestas.plan || 'free';
    btn.textContent = 'Confirmar registro';
    btn.classList.add('activo');
    div.querySelectorAll('.plan-card').forEach(card=>{
      card.addEventListener('click', ()=>{
        div.querySelectorAll('.plan-card').forEach(c=>c.classList.remove('selected'));
        card.classList.add('selected');
        respuestas.plan = card.dataset.plan;
        btn.textContent = card.dataset.plan === 'free' ? 'Confirmar registro' : 'Ir a pagar';
      });
    });
    btn.addEventListener('click', async ()=>{
      if(respuestas.plan !== 'free'){
        alert('Aquí se conectará el checkout de Mercado Pago (pendiente de integrar).');
        return;
      }
      btn.textContent = 'Registrando...';
      btn.classList.remove('activo');
      try{
        const { data, error } = await window.supabase.rpc('registrar_socio', {
          p_pet: respuestas.mascota,
          p_species: respuestas.especie,
          p_breed: respuestas.raza,
          p_comuna: '',
          p_email: respuestas.correo,
          p_edad: respuestas.edad,
          p_peso: respuestas.peso,
          p_tamano: respuestas.tamano,
          p_representante_nombre: respuestas.nombre,
          p_representante_rut: respuestas.rut,
          p_representante_telefono: '',
          p_foto: null,
          p_documentos: null,
          p_notas_medicas: null
        });
        if(error || !data || !data[0]){
          alert('No se pudo registrar: ' + (error?.message || 'error desconocido'));
          btn.textContent = 'Confirmar registro';
          btn.classList.add('activo');
          return;
        }
        respuestas.codigo_socio = data[0].codigo;

        // Correo de bienvenida (público, seguro de enviar desde el navegador)
        try{
          await emailjs.send('service_ch7ncxl', 'template_u9x5p1i', {
            to_email: respuestas.correo,
            to_name: respuestas.nombre,
            codigo: respuestas.codigo_socio,
            mensaje_extra: '¡Bienvenido a la comunidad! Explora el directorio y empieza a disfrutar tus beneficios.'
          });
        } catch(emailErr){
          console.warn('El registro se guardó, pero el correo de bienvenida falló:', emailErr);
        }

        avanzar();
      } catch(e){
        alert('Error de conexión al registrar: ' + e.message);
        btn.textContent = 'Confirmar registro';
        btn.classList.add('activo');
      }
    });
  }

  btnVolver.classList.toggle('visible', index > 0);
  progresoBar.style.width = ((index+1)/preguntas.length*100) + '%';
  progresoTexto.textContent = `${index+1} / ${preguntas.length}`;

  return div;
}

function avanzar(){
  const actualDiv = stage.querySelector('.paso.activo');
  if(actualDiv) actualDiv.classList.add('saliendo');
  pasoActual++;
  if(pasoActual >= preguntas.length){
    setTimeout(mostrarFinal, 400);
    return;
  }
  const nuevo = renderPaso(pasoActual, 1);
  setTimeout(()=>{ if(actualDiv) actualDiv.remove(); }, 460);
}

function retroceder(){
  if(pasoActual===0) return;
  const actualDiv = stage.querySelector('.paso.activo');
  if(actualDiv) actualDiv.classList.add('saliendo');
  pasoActual--;
  const nuevo = renderPaso(pasoActual, -1);
  setTimeout(()=>{ if(actualDiv) actualDiv.remove(); }, 460);
}

btnVolver.addEventListener('click', retroceder);

function mostrarFinal(){
  // Chequeo silencioso de bot: si el campo invisible tiene texto, no era humano.
  const honeypot = document.getElementById('honeypot');
  if(honeypot && honeypot.value){
    console.warn('Registro descartado (honeypot activado).');
    return;
  }
  progresoBar.style.width = '100%';
  progresoTexto.style.opacity = 0;
  btnVolver.classList.remove('visible');
  const div = document.createElement('div');
  div.className = 'paso';
  div.innerHTML = `
    <div class="paso-inner" style="text-align:center;">
      <div class="final-check"><svg viewBox="0 0 24 24" fill="none"><path d="M5 13l4 4L19 7" stroke="#151515" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
      <h1 class="pregunta">¡Bienvenido al club, ${respuestas.nombre.split(' ')[0]}!</h1>
      <p style="color:rgba(255,255,255,0.6); font-size:15px;">Te enviamos el carnet de ${respuestas.mascota} a ${respuestas.correo}</p>
      <div class="resumen">
        <div class="resumen-row"><span>Código de socio</span><b style="color:var(--amarillo);">${respuestas.codigo_socio || '—'}</b></div>
        <div class="resumen-row"><span>Dueño/a</span><b>${respuestas.nombre}</b></div>
        <div class="resumen-row"><span>Mascota</span><b>${respuestas.mascota}</b></div>
        <div class="resumen-row"><span>Especie / Raza</span><b>${respuestas.especie} · ${respuestas.raza}</b></div>
        <div class="resumen-row"><span>Edad / Peso / Tamaño</span><b>${respuestas.edad} · ${respuestas.peso} · ${respuestas.tamano}</b></div>
        <div class="resumen-row"><span>RUT</span><b>${respuestas.rut}</b></div>
        <div class="resumen-row"><span>Plan</span><b>${(respuestas.plan||'free').toUpperCase()}</b></div>
      </div>
      <a href="https://mimascotaclub.netlify.app" class="btn-ir-inicio">Ir al inicio</a>
    </div>
  `;
  stage.appendChild(div);
  requestAnimationFrame(()=> div.classList.add('activo'));
}

// arranque
renderPaso(0, 1);
</script>
</body>
</html>
