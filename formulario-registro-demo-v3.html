<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mi Mascota Club — Registro</title>

<!-- ÍCONO DEL SITIO (favicon). El SVG lo usan los navegadores modernos; el PNG de
     32px es el respaldo para los que no leen SVG, y el apple-touch-icon es el que
     aparece cuando alguien guarda el sitio en la pantalla de inicio del teléfono. -->
<link rel="icon" type="image/svg+xml" href="/assets/favicon.svg">
<link rel="icon" type="image/png" sizes="32x32" href="/assets/favicon-32.png">
<link rel="apple-touch-icon" sizes="180x180" href="/assets/apple-touch-icon.png">
<meta name="theme-color" content="#FFCE00">

<!-- Vista previa del enlace de registro: este es EL enlace que se reparte por
     WhatsApp e Instagram, así que el título y la descripción están escritos
     para ese momento, no para el sitio en general. -->
<meta name="description" content="Inscribe a tu mascota en Mi Mascota Club. Es gratis, toma dos minutos y recibes el carnet digital de tu mascota al instante.">
<link rel="canonical" href="https://mimascotaclub.cl/registro">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Mi Mascota Club">
<meta property="og:locale" content="es_CL">
<meta property="og:url" content="https://mimascotaclub.cl/registro">
<meta property="og:title" content="Inscribe a tu mascota — Mi Mascota Club">
<meta property="og:description" content="Gratis, en dos minutos. Recibes el carnet digital de tu mascota al instante y accedes a los beneficios del club.">
<meta property="og:image" content="https://mimascotaclub.cl/assets/images/og-image.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="Mi Mascota Club — beneficios reales para tu mascota y para ti como dueño">
<meta name="twitter:card" content="summary_large_image">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700;900&display=swap" rel="stylesheet">
<!-- Librería para dibujar el QR del carnet -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
  :root{
    --amarillo:#FFCE00;
    --turquesa:#47C9C9;
    --negro:#151515;
    --blanco:#FFFFFF;
    --gris-suave:#F7F7F5;
    --gris-linea:#E4E2DC;
  }
  *{box-sizing:border-box;}
  html,body{height:100%; max-width:100%; overflow-x:hidden;}
  body{
    margin:0;
    font-family:'Lato',sans-serif;
    background:var(--negro);
    color:var(--negro);
    overflow:hidden;
  }

  /* ---------- Barra de progreso ---------- */
  .progreso-wrap{
    position:fixed; top:0; left:0; right:0; height:4px;
    background:rgba(255,255,255,0.08); z-index:50;
  }
  .progreso-bar{
    height:100%; width:0%;
    background:var(--amarillo);
    transition:width .45s cubic-bezier(.65,0,.35,1);
  }
  .progreso-texto{
    position:fixed; top:18px; right:24px; z-index:50;
    font-size:13px; font-weight:700; letter-spacing:.04em;
    color:rgba(255,255,255,0.55);
  }
  .btn-volver{
    position:fixed; top:14px; left:20px; z-index:50;
    background:none; border:none; color:rgba(255,255,255,0.55);
    font-family:'Lato',sans-serif; font-weight:700; font-size:14px;
    cursor:pointer; display:flex; align-items:center; gap:6px;
    padding:8px; opacity:0; transition:opacity .3s;
  }
  .btn-volver.visible{opacity:1;}
  .btn-volver:hover{color:var(--blanco);}

  /* ---------- Escenario de pasos ---------- */
  .stage{
    /* width:100% y NO 100vw. 100vw mide el viewport "ideal" y en Android
       terminaba siendo más ancho que la pantalla real: eso estiraba la página
       unos 40px y empujaba el contador de pasos fuera de la vista (se leía
       "11 /" en vez de "11 / 12"). Con 100% se mide contra el body, que sí
       mide lo que se ve. */
    position:relative; width:100%;
    /* 100vh en Android Chrome mide la pantalla SIN descontar la barra del
       navegador, así que parte del contenido queda debajo de ella y no hay
       forma de alcanzarlo. 100dvh sí descuenta la barra; el 100vh queda
       primero como respaldo para navegadores viejos que no entienden dvh. */
    height:100vh;
    height:100dvh;
    background:var(--negro);
  }
  .paso{
    position:absolute; inset:0;
    display:flex; flex-direction:column; align-items:center;
    /* Antes esto era justify-content:center sin overflow. Cuando un paso es
       más alto que la pantalla —la pantalla final con el carnet y el QR, en
       teléfonos Android— el contenido se salía y NO se podía desplazar: los
       botones de abajo quedaban inalcanzables.
       Ahora el paso se desplaza por dentro, y el centrado vertical lo hace
       "margin:auto 0" del .paso-inner: centra cuando sobra espacio y deja
       desplazar cuando falta, sin recortar el borde de arriba (que es lo que
       pasa al combinar justify-content:center con overflow). */
    overflow-y:auto;
    overscroll-behavior:contain;
    -webkit-overflow-scrolling:touch;
    /* El padding de arriba deja libre la franja del botón "Atrás", que va fijo
       en la pantalla. Sin él, en un paso más alto que la pantalla el contenido
       arranca pegado arriba y el eyebrow queda debajo del botón. */
    padding:56px 24px 32px;
    opacity:0; pointer-events:none;
    transform:translateX(40px);
    transition:opacity .45s cubic-bezier(.65,0,.35,1), transform .45s cubic-bezier(.65,0,.35,1);
  }
  .paso.activo{
    opacity:1; pointer-events:auto; transform:translateX(0);
  }
  .paso.saliendo{
    opacity:0; transform:translateX(-40px);
  }

  /* flex-shrink:0 es imprescindible: sin él, este bloque es un hijo flexible
     que se APLASTA para caber en la pantalla en vez de sobresalir, y entonces
     su contenido (el carnet, el QR, los botones) se sale por abajo sin generar
     desplazamiento. Con shrink en 0 el bloque conserva su alto real y el .paso
     sí puede desplazarse. */
  .paso-inner{ width:100%; max-width:520px; margin:auto 0; flex-shrink:0; }

  .eyebrow{
    color:var(--turquesa); font-weight:900; font-size:13px;
    letter-spacing:.12em; text-transform:uppercase; margin:0 0 14px;
  }
  .pregunta{
    color:var(--blanco); font-size:clamp(24px,4.2vw,38px); font-weight:900;
    line-height:1.15; margin:0 0 28px;
  }
  .pregunta .pet-name{ color:var(--amarillo); }

  input[type=text], input[type=email]{
    width:100%; background:transparent; border:none;
    border-bottom:2px solid rgba(255,255,255,0.25);
    color:var(--blanco); font-family:'Lato',sans-serif;
    font-size:clamp(20px,3vw,28px); font-weight:700;
    padding:10px 2px 14px; outline:none;
    transition:border-color .25s;
  }
  input::placeholder{ color:rgba(255,255,255,0.3); font-weight:400; }
  input:focus{ border-bottom-color:var(--amarillo); }

  .hint{ color:rgba(255,255,255,0.4); font-size:14px; margin-top:10px; }

  /* ---------- Opciones tipo tarjeta (especie) ---------- */
  .opciones-grid{
    display:grid; grid-template-columns:1fr 1fr; gap:14px; margin-top:6px;
  }
  .opcion-card{
    background:rgba(255,255,255,0.04);
    border:2px solid rgba(255,255,255,0.12);
    border-radius:16px; padding:24px 16px; text-align:center;
    cursor:pointer; transition:all .2s;
    display:flex; flex-direction:column; align-items:center; gap:10px;
  }
  .opcion-card .emoji{ font-size:34px; }
  .opcion-card span.label{ color:var(--blanco); font-weight:700; font-size:16px; }
  .opcion-card:hover{ border-color:var(--turquesa); transform:translateY(-2px); }
  .opcion-card.selected{ border-color:var(--amarillo); background:rgba(255,206,0,0.08); }

  /* ---------- Select estilizado + buscador ---------- */
  .select-wrap{ position:relative; }
  .select-fake{
    width:100%; background:rgba(255,255,255,0.04);
    border:2px solid rgba(255,255,255,0.15); border-radius:12px;
    padding:16px 18px; color:var(--blanco); font-size:18px; font-weight:700;
    cursor:pointer; display:flex; justify-content:space-between; align-items:center;
    transition:border-color .2s;
  }
  .select-fake:hover, .select-fake.abierto{ border-color:var(--turquesa); }
  .select-fake .chevron{ color:var(--turquesa); transition:transform .2s; }
  .select-fake.abierto .chevron{ transform:rotate(180deg); }

  .dropdown-panel{
    position:absolute; top:calc(100% + 8px); left:0; right:0;
    background:#1E1E1E; border:1px solid rgba(255,255,255,0.12);
    border-radius:12px; max-height:280px; overflow:hidden;
    display:none; flex-direction:column; z-index:20;
    box-shadow:0 20px 40px rgba(0,0,0,0.4);
  }
  .dropdown-panel.abierto{ display:flex; }
  .dropdown-search{
    padding:10px; border-bottom:1px solid rgba(255,255,255,0.08);
  }
  .dropdown-search input{
    border-bottom:none; font-size:15px; font-weight:400;
    background:rgba(255,255,255,0.05); border-radius:8px; padding:10px 12px;
  }
  .dropdown-list{ overflow-y:auto; padding:6px; }
  .dropdown-item{
    padding:11px 12px; color:var(--blanco); font-size:15px;
    border-radius:8px; cursor:pointer;
  }
  .dropdown-item:hover, .dropdown-item.hl{ background:rgba(255,206,0,0.12); color:var(--amarillo); }

  /* ---------- Botón continuar ---------- */
  .btn-continuar{
    margin-top:32px; background:var(--amarillo); color:var(--negro);
    border:none; border-radius:100px; padding:16px 34px;
    font-family:'Lato',sans-serif; font-weight:900; font-size:16px;
    cursor:pointer; display:inline-flex; align-items:center; gap:10px;
    transition:transform .15s, box-shadow .15s;
    opacity:.4; pointer-events:none;
  }
  .btn-continuar.activo{ opacity:1; pointer-events:auto; }
  .btn-continuar:hover{ transform:translateY(-2px); box-shadow:0 10px 24px rgba(255,206,0,0.25); }
  .btn-continuar:active{ transform:translateY(0); }
  .tecla-enter{
    font-size:11px; background:rgba(0,0,0,0.15); padding:3px 7px;
    border-radius:5px; font-weight:700;
  }

  /* ---------- Pantalla final ---------- */
  .final-check{
    width:84px; height:84px; border-radius:50%;
    background:var(--turquesa); display:flex; align-items:center; justify-content:center;
    margin:0 auto 24px; animation:pop .5s cubic-bezier(.34,1.56,.64,1);
  }
  @keyframes pop{ from{ transform:scale(0); } to{ transform:scale(1); } }
  .final-check svg{ width:40px; height:40px; }
  .resumen{
    background:rgba(255,255,255,0.04); border-radius:14px; padding:18px 20px;
    margin-top:22px; text-align:left;
  }
  .resumen-row{ display:flex; justify-content:space-between; padding:7px 0; font-size:14px;
    border-bottom:1px solid rgba(255,255,255,0.06); color:rgba(255,255,255,0.8); }
  .resumen-row:last-child{ border-bottom:none; }
  .resumen-row b{ color:var(--blanco); }

  /* ---------- Consentimiento antes de crear la cuenta ----------
     Una casilla que hay que marcar a mano. El servidor además rechaza
     el registro si no viene marcada, así que no es solo decoración. */
  .consentimiento{
    display:flex; gap:12px; align-items:flex-start;
    margin-top:26px; padding:16px 18px;
    background:rgba(255,255,255,0.04); border:1px solid rgba(255,255,255,0.16);
    border-radius:14px; cursor:pointer; text-align:left;
  }
  .consentimiento input{
    width:22px; height:22px; flex:0 0 auto; margin:1px 0 0;
    accent-color:var(--amarillo); cursor:pointer;
  }
  .consentimiento span{ font-size:13.5px; line-height:1.55; color:rgba(255,255,255,0.78); }
  .consentimiento a{ color:var(--amarillo); font-weight:700; }
  .btn-continuar:disabled, .btn-continuar.bloqueado{
    opacity:0.4; cursor:not-allowed; transform:none;
  }

  /* ---------- Carnet final con QR ----------
     Es lo único que el socio se lleva del registro: si no ve un carnet
     con un QR, no tiene nada que mostrar en el mesón del negocio. */
  .carnet{
    width:100%; max-width:320px; margin:22px auto 0;
    background:#1E1E1E; border:1px solid rgba(255,255,255,0.14);
    border-radius:22px; padding:24px 22px 20px; position:relative;
    box-shadow:0 24px 50px -18px rgba(0,0,0,0.6);
  }
  .carnet::before{
    content:""; position:absolute; inset:9px;
    border:1.5px dashed rgba(255,255,255,0.16); border-radius:16px; pointer-events:none;
  }
  .carnet-badge{
    position:absolute; top:-11px; right:20px; background:var(--amarillo); color:var(--negro);
    font-size:10.5px; font-weight:900; padding:5px 11px; border-radius:8px;
  }
  .carnet-top{ display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:14px; }
  .carnet-marca{ font-size:11px; font-weight:900; letter-spacing:0.04em; color:var(--blanco); }
  .carnet-id{ font-family:monospace; font-size:11px; color:var(--amarillo); font-weight:700; }
  .carnet-nombre{ font-size:25px; font-weight:900; color:var(--blanco); line-height:1.1; }
  .carnet-raza{ font-size:12.5px; color:rgba(255,255,255,0.6); font-weight:700; margin-top:3px; text-transform:capitalize; }
  .carnet-qr{ background:#fff; border-radius:12px; padding:10px; margin-top:16px; display:flex; justify-content:center; }
  .carnet-qr img, .carnet-qr canvas{ display:block; }
  .carnet-pie{
    display:flex; justify-content:space-between; font-family:monospace; font-size:10px;
    color:rgba(255,255,255,0.5); border-top:1px solid rgba(255,255,255,0.14);
    padding-top:11px; margin-top:14px; text-transform:uppercase; letter-spacing:0.05em;
  }
  .carnet-pie b{ display:block; color:var(--blanco); font-size:12px; margin-top:3px; letter-spacing:0; text-transform:none; }
  .carnet-ayuda{
    max-width:340px; margin:16px auto 0; font-size:13px; line-height:1.55;
    color:rgba(255,255,255,0.6);
  }
  .btn-secundario{
    display:inline-block; margin-top:12px; padding:13px 26px; border-radius:999px;
    border:2px solid rgba(255,255,255,0.25); color:var(--blanco); text-decoration:none;
    font-weight:800; font-size:14px;
  }

  /* ---------- Casillas de código (estilo GitHub) ---------- */
  .codigo-boxes{ display:flex; gap:10px; margin-top:8px; }
  .codigo-box{
    width:52px; height:60px; text-align:center;
    font-size:26px; font-weight:900; color:var(--blanco);
    background:rgba(255,255,255,0.04); border:2px solid rgba(255,255,255,0.18);
    border-radius:10px; outline:none; transition:border-color .2s, transform .15s;
  }
  .codigo-box:focus{ border-color:var(--amarillo); transform:translateY(-2px); }
  .codigo-box.error{ border-color:#FF5C5C; animation:shake .35s; }
  @keyframes shake{ 0%,100%{transform:translateX(0);} 25%{transform:translateX(-6px);} 75%{transform:translateX(6px);} }
  .codigo-estado{ margin-top:14px; font-size:14px; min-height:20px; }
  .codigo-estado.ok{ color:var(--turquesa); }
  .codigo-estado.err{ color:#FF7A7A; }
  .reenviar-link{ background:none; border:none; color:var(--turquesa); font-weight:700;
    font-family:'Lato',sans-serif; font-size:14px; cursor:pointer; padding:0; text-decoration:underline; }
  .reenviar-link:disabled{ color:rgba(255,255,255,0.3); cursor:default; text-decoration:none; }
  .spinner{
    width:18px; height:18px; border:2.5px solid rgba(255,255,255,0.2);
    border-top-color:var(--amarillo); border-radius:50%; animation:girar .7s linear infinite;
    display:inline-block; vertical-align:middle; margin-right:8px;
  }
  @keyframes girar{ to{ transform:rotate(360deg); } }

  /* ---------- Tarjetas de plan ---------- */
  .planes-grid{ display:flex; flex-direction:column; gap:14px; margin-top:6px; }
  .plan-card{
    background:rgba(255,255,255,0.04); border:2px solid rgba(255,255,255,0.12);
    border-radius:16px; padding:20px 22px; cursor:pointer; transition:all .2s;
    display:flex; justify-content:space-between; align-items:center;
  }
  .plan-card:hover{ border-color:var(--turquesa); }
  .plan-card.selected{ border-color:var(--amarillo); background:rgba(255,206,0,0.07); }
  .plan-nombre{ color:var(--blanco); font-weight:900; font-size:17px; }
  .plan-desc{ color:rgba(255,255,255,0.5); font-size:13px; margin-top:4px; }
  .plan-precio{ color:var(--amarillo); font-weight:900; font-size:18px; white-space:nowrap; }
  /* Planes que todavía no existen: se muestran para que se sepa que vienen,
     pero sin precio (no está definido) y sin poder elegirlos. */
  .plan-card.bloqueado{ opacity:0.55; cursor:default; border-style:dashed; }
  .plan-card.bloqueado:hover{ border-color:rgba(255,255,255,0.18); }
  .plan-pronto{
    color:var(--turquesa); font-weight:900; font-size:11px;
    letter-spacing:0.06em; text-transform:uppercase; white-space:nowrap;
  }

  .hint.ok{ color:var(--turquesa); }

  /* ---------- Mascota animada (paso del código) ---------- */
  .mascota-wrap{ display:flex; justify-content:center; width:362px; max-width:100%; margin:0 0 6px; }
  .mascota-figura{
    position:relative;
    width: clamp(120px, 34vw, 168px);
    height: clamp(151px, 42vw, 211px);
  }
  .mascota-frame{
    position:absolute; inset:0; width:100%; height:100%; object-fit:contain;
    opacity:0; transform: scale(1);
    transition: opacity .35s ease-in-out, transform .35s cubic-bezier(.34,1.2,.64,1);
  }
  /* Estado por defecto: viendo */
  .mascota-frame.viendo{ opacity:1; }

  /* Estado: tapada (escribiendo código) */
  .mascota-figura.mascota-tapada .mascota-frame.viendo{ opacity:0; transform:scale(.96); }
  .mascota-figura.mascota-tapada .mascota-frame.tapada{ opacity:1; }

  /* Estado: espiando (pulso cada 2.2s mientras está tapada) */
  .mascota-figura.mascota-tapada.mascota-espiando .mascota-frame.tapada{ opacity:0; }
  .mascota-figura.mascota-tapada.mascota-espiando .mascota-frame.espiando{ opacity:1; transform:scale(1.04); }

  /* ---------- Botón ir al inicio ---------- */
  .btn-ir-inicio{
    margin-top: 18px; background: transparent; color: var(--turquesa);
    border: 2px solid var(--turquesa); border-radius: 100px; padding: 14px 30px;
    font-family:'Lato',sans-serif; font-weight:900; font-size:15px; cursor:pointer;
    transition: all .2s; text-decoration:none; display:inline-block;
  }
  .btn-ir-inicio:hover{ background: var(--turquesa); color:var(--negro); }

  /* ---------- Verificación de tenencia (chip + cartilla) ---------- */
  .verif-caja{
    width:100%; text-align:left;
    background:rgba(71,201,201,0.10); border:1px solid rgba(71,201,201,0.32);
    border-radius:16px; padding:15px 17px; margin:0 0 20px;
  }
  .verif-caja b{ color:var(--turquesa); font-size:13px; letter-spacing:0.04em; text-transform:uppercase; }
  .verif-caja p{ margin:7px 0 0; font-size:14px; line-height:1.6; color:rgba(255,255,255,0.72); }

  .verif-foto{
    display:flex; align-items:center; gap:13px;
    width:100%; margin-top:14px;
    background:rgba(255,255,255,0.05); border:1px dashed rgba(255,255,255,0.28);
    border-radius:16px; padding:14px 16px; cursor:pointer; text-align:left;
    color:rgba(255,255,255,0.78); font-family:'Lato',sans-serif;
    font-size:15px; font-weight:700; transition:all .2s;
  }
  .verif-foto:hover{ border-color:var(--amarillo); color:var(--blanco); }
  .verif-foto img{ width:46px; height:46px; object-fit:cover; border-radius:10px; display:none; flex:none; }
  .verif-foto.cargada{ border-style:solid; border-color:var(--turquesa); color:var(--blanco); }
  .verif-foto.cargada img{ display:block; }

  .verif-saltar{
    background:none; border:none; color:rgba(255,255,255,0.42);
    font-family:'Lato',sans-serif; font-size:14px; text-decoration:underline;
    cursor:pointer; margin-top:16px; padding:4px;
  }
  .verif-saltar:hover{ color:rgba(255,255,255,0.75); }

  .verif-aviso{
    width:100%; text-align:left; margin:0 auto 14px;
    background:rgba(255,206,0,0.10); border:1px solid rgba(255,206,0,0.38);
    border-radius:14px; padding:14px 16px;
    font-size:14px; line-height:1.6; color:rgba(255,255,255,0.8);
  }
  .verif-cta{
    display:block; width:100%; margin:0 auto 18px;
    background:var(--amarillo); color:var(--negro); font-weight:900; font-size:16px;
    text-decoration:none; padding:15px 20px; border-radius:14px; text-align:center;
    transition:all .2s;
  }
  .verif-cta:hover{ transform:translateY(-2px); box-shadow:0 10px 24px rgba(255,206,0,0.25); }

  /* ---------- Grupo del club y pase de fundador (pantalla final) ---------- */
  .final-extra{
    width:100%; text-align:left; margin:0 auto 14px;
    background:rgba(255,255,255,0.05); border:1px solid rgba(255,255,255,0.18);
    border-radius:16px; padding:16px 18px;
  }
  .final-extra--fundador{
    background:rgba(255,206,0,0.10); border-color:rgba(255,206,0,0.40);
  }
  .final-extra__t{
    font-weight:900; font-size:15px; color:#fff; margin-bottom:6px;
  }
  .final-extra p{
    margin:0 0 14px; font-size:13.5px; line-height:1.55; color:rgba(255,255,255,0.72);
  }

function validarRut(rutCompleto){
  rutCompleto = rutCompleto.replace(/\./g,'').replace(/-/g,'').trim();
  if(rutCompleto.length < 2) return false;
  const cuerpo = rutCompleto.slice(0,-1);
  let dv = rutCompleto.slice(-1).toUpperCase();
  if(!/^\d+$/.test(cuerpo)) return false;
  if(/^(\d)\1*$/.test(cuerpo)) return false; // rechaza 000000, 111111, 22222222, etc.
  if(cuerpo.length < 7) return false; // RUTs reales en Chile parten en 7 dígitos como mínimo
  let suma = 0, multiplo = 2;
  for(let i = cuerpo.length - 1; i >= 0; i--){
    suma += parseInt(cuerpo[i]) * multiplo;
    multiplo = multiplo === 7 ? 2 : multiplo + 1;
  }
  const resto = 11 - (suma % 11);
  const dvEsperado = resto === 11 ? '0' : resto === 10 ? 'K' : resto.toString();
  return dv === dvEsperado;
}
function formatearRut(valor){
  valor = valor.replace(/[^0-9kK]/g,'');
  if(valor.length <= 1) return valor;
  const cuerpo = valor.slice(0,-1);
  const dv = valor.slice(-1).toUpperCase();
  return cuerpo.replace(/\B(?=(\d{3})+(?!\d))/g,'.') + '-' + dv;
}

/* Las fotos de cartilla salen de la cámara del teléfono y pesan varios MB. Se
   achican en el navegador antes de mandarlas: la base guarda la imagen como
   data URL y el tope del servidor son 900 KB. Si a la primera queda muy pesada,
   baja la calidad por pasos en vez de fallar. */
function comprimirImagen(file, maxLado, calidad){
  return new Promise((resolve, reject) => {
    const lector = new FileReader();
    lector.onerror = () => reject(new Error('No se pudo leer el archivo'));
    lector.onload = () => {
      const img = new Image();
      img.onerror = () => reject(new Error('No es una imagen válida'));
      img.onload = () => {
        const escala = Math.min(1, maxLado / Math.max(img.width, img.height));
        const canvas = document.createElement('canvas');
        canvas.width  = Math.round(img.width  * escala);
        canvas.height = Math.round(img.height * escala);
        const ctx = canvas.getContext('2d');
        ctx.fillStyle = '#FFFFFF';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.drawImage(img, 0, 0, canvas.width, canvas.height);

        let q = calidad;
        let out = canvas.toDataURL('image/jpeg', q);
        while(out.length > 800000 && q > 0.35){
          q -= 0.12;
          out = canvas.toDataURL('image/jpeg', q);
        }
        if(out.length > 800000) reject(new Error('La imagen quedó demasiado pesada'));
        else resolve(out);
      };
      img.src = lector.result;
    };
    lector.readAsDataURL(file);
  });
}

          espiandoInterval = setInterval(()=>{
            mascota.classList.add('mascota-espiando');
            setTimeout(()=> mascota.classList.remove('mascota-espiando'), 400);
          }, 2200);
        }
      }
    }

    async function enviarCodigo(){
      estado.className = 'codigo-estado';
      estado.innerHTML = `<span class="spinner"></span> Enviando código...`;
      btnReenviar.disabled = true;
      try{
        const r = await fetch('/.netlify/functions/enviar-codigo', {
          method:'POST', headers:{'Content-Type':'application/json'},
          body: JSON.stringify({ email: respuestas.correo })
        });
        const data = await r.json();
        if(data.ok){
          estado.className = 'codigo-estado ok';
          estado.textContent = 'Código enviado. Revisa tu bandeja de entrada.';
        } else {
          estado.className = 'codigo-estado err';
          estado.textContent = data.mensaje || 'No se pudo enviar el código.';
        }
      } catch(e){
        estado.className = 'codigo-estado err';
        estado.textContent = 'Error de conexión. Intenta de nuevo.';
      }
      setTimeout(()=> btnReenviar.disabled = false, 20000);
    }

    enviarCodigo(); // se envía apenas se llega a este paso
    btnReenviar.addEventListener('click', enviarCodigo);

    boxes.forEach((box, i)=>{
      box.addEventListener('input', ()=>{
        box.value = box.value.replace(/[^0-9]/g,'');
        if(box.value && i < boxes.length-1) boxes[i+1].focus();
        chequearCompleto();
        actualizarMascota();
      });
      box.addEventListener('keydown', e=>{
        if(e.key==='Backspace' && !box.value && i>0) boxes[i-1].focus();
      });
      box.addEventListener('paste', e=>{
        e.preventDefault();
        const texto = (e.clipboardData.getData('text')||'').replace(/[^0-9]/g,'').slice(0,6);
        texto.split('').forEach((d,idx)=>{ if(boxes[idx]) boxes[idx].value = d; });
        boxes[Math.min(texto.length,6)-1]?.focus();
        chequearCompleto();
      });
    });

    async function chequearCompleto(){
      const codigo = boxes.map(b=>b.value).join('');
      if(codigo.length !== 6) return;
      estado.className = 'codigo-estado';
      estado.innerHTML = `<span class="spinner"></span> Verificando...`;
      try{
        const { data, error } = await window.supabase.rpc('verificar_codigo_email', {
          p_email: respuestas.correo, p_codigo: codigo
        });
        if(error || !data){
          estado.className = 'codigo-estado err';
          estado.textContent = 'Código incorrecto o vencido.';
          boxes.forEach(b=> b.classList.add('error'));
          setTimeout(()=> boxes.forEach(b=> b.classList.remove('error')), 400);
          return;
        }
        estado.className = 'codigo-estado ok';
        estado.textContent = '¡Correo verificado!';
        mascota.classList.remove('mascota-tapada','mascota-espiando');
        clearInterval(espiandoInterval);
        respuestas.correo_verificado = true;
        btn.classList.add('activo');
        setTimeout(avanzar, 500);
      } catch(e){
        estado.className = 'codigo-estado err';
        estado.textContent = 'Error de conexión al verificar.';
      }
    }
    setTimeout(()=> boxes[0].focus(), 300);
  }

  if(q.tipo === 'chip'){
    const input     = div.querySelector('#campo-chip');
    const hint      = div.querySelector('#chipHint');
    const btn       = div.querySelector('#btnContinuar');
    const fotoBtn   = div.querySelector('#verifFotoBtn');
    const fotoInput = div.querySelector('#verifFotoInput');
    const fotoPrev  = div.querySelector('#verifFotoPrev');
    const fotoTxt   = div.querySelector('#verifFotoTxt');

    const acciones = div.querySelector('#verifAcciones');
    if(respuestas.cartilla){
      fotoPrev.src = respuestas.cartilla;
      fotoBtn.classList.add('cargada');
      acciones.style.display = '';
      fotoTxt.textContent = 'Cartilla lista — revísala antes de continuar';
    }

    /* El formato no bloquea nada: hay mascotas viejas con chips antiguos que no
       son de 15 dígitos. El mensaje orienta, la revisión manual decide. */
    function repintar(){
      const limpio = (input.value || '').replace(/[^0-9A-Za-z]/g, '');
      respuestas.chip = input.value;
      btn.classList.toggle('activo', limpio.length > 0 || !!respuestas.cartilla);

      if(!limpio){
        hint.className = 'hint';
        hint.textContent = 'Está en la cartilla veterinaria o en el carnet del microchip';
      } else if(/^[0-9]{15}$/.test(limpio)){
        hint.className = 'hint ok';
        hint.textContent = '✓ Formato correcto';
      } else if(limpio.length < 9){
        hint.className = 'hint';
        hint.textContent = 'Van ' + limpio.length + ' — los chips en Chile tienen 15 dígitos';
      } else {
        hint.className = 'hint';
        hint.textContent = 'No parece un chip de 15 dígitos. Si es uno antiguo, sube igual la foto de la cartilla y lo revisamos a mano.';
      }
    }

    input.addEventListener('input', repintar);
    input.addEventListener('keydown', e=>{ if(e.key==='Enter' && btn.classList.contains('activo')) avanzar(); });
    setTimeout(()=> input.focus(), 250);

    /* Con la foto ya puesta, tocar el recuadro la AMPLÍA. Volver a abrir el
       selector por accidente es peor de lo que parece: en el teléfono el
       selector de fotos puede descargar la página y perder todo lo escrito.
       Cambiarla queda como un botón aparte, explícito. */
    fotoBtn.addEventListener('click', ()=>{
      if(fotoBtn.classList.contains('cargada')) abrirLupa(respuestas.cartilla);
      else fotoInput.click();
    });
    div.querySelector('#verifVerBtn').addEventListener('click', ()=> abrirLupa(respuestas.cartilla));
    div.querySelector('#verifCambiarBtn').addEventListener('click', ()=> fotoInput.click());
    fotoInput.addEventListener('change', async ()=>{
      const f = fotoInput.files && fotoInput.files[0];
      if(!f) return;
      fotoTxt.textContent = 'Preparando la foto...';
      try{
        respuestas.cartilla = await comprimirImagen(f, 1280, 0.72);
        fotoPrev.src = respuestas.cartilla;
        fotoBtn.classList.add('cargada');
        acciones.style.display = '';
        fotoTxt.textContent = 'Cartilla lista — revísala antes de continuar';
      }catch(e){
        console.warn('No se pudo leer la cartilla:', e);
        respuestas.cartilla = null;
        fotoBtn.classList.remove('cargada');
        acciones.style.display = 'none';
        fotoTxt.textContent = 'No pudimos leer esa imagen. Intenta con otra.';
      }
      repintar();
    });

    div.querySelector('#verifSaltar').addEventListener('click', ()=>{
      respuestas.chip = '';
      respuestas.cartilla = null;
      cerrarLupa();
      avanzar();
    });

    btn.addEventListener('click', ()=> btn.classList.contains('activo') && avanzar());
    repintar();
  }

  if(q.tipo === 'plan'){
    const btn = div.querySelector('#btnContinuar');
    respuestas.plan = respuestas.plan || 'free';
    btn.textContent = 'Confirmar registro';
    btn.classList.add('activo');

    /* El botón queda bloqueado hasta que marque la casilla. Y aunque alguien
       lo desbloquee a mano desde el navegador, el servidor rechaza el registro
       igual: la aceptación es obligatoria en la base de datos. */
    const chk = div.querySelector('#aceptaTerminos');
    const revisarConsentimiento = () => {
      const ok = chk && chk.checked;
      btn.classList.toggle('bloqueado', !ok);
      btn.disabled = !ok;
      respuestas.acepta_terminos = !!ok;
    };
    if(chk) chk.addEventListener('change', revisarConsentimiento);
    revisarConsentimiento();
    /* Solo se puede elegir Free: los otros dos están de muestra, sin precio,
       hasta que se definan de verdad. */
    div.querySelectorAll('.plan-card:not(.bloqueado)').forEach(card=>{
      card.addEventListener('click', ()=>{
        div.querySelectorAll('.plan-card').forEach(c=>c.classList.remove('selected'));
        card.classList.add('selected');
        respuestas.plan = card.dataset.plan;
      });
    });
    btn.addEventListener('click', async ()=>{
      btn.textContent = 'Registrando...';
      btn.classList.remove('activo');
      try{
        const { data, error } = await window.supabase.rpc('registrar_socio', {
          p_pet: respuestas.mascota,
          p_species: respuestas.especie,
          p_breed: respuestas.raza,
          p_comuna: '',
          p_email: respuestas.correo,
          p_edad: respuestas.edad,
          p_peso: respuestas.peso,
          p_tamano: respuestas.tamano,
          p_representante_nombre: respuestas.nombre,
          p_representante_rut: respuestas.rut,
          p_representante_telefono: '',
          p_foto: null,
          p_documentos: null,
          p_notas_medicas: null,
          p_acepta_terminos: respuestas.acepta_terminos === true,
          p_terminos_version: '2026-09-17',
          p_chip: (respuestas.chip || '').trim() || null,
          p_cartilla: respuestas.cartilla || null
        });
        if(error || !data || !data[0]){
          alert('No se pudo registrar: ' + (error?.message || 'error desconocido'));
          btn.textContent = 'Confirmar registro';
          btn.classList.add('activo');
          return;
        }
        respuestas.codigo_socio  = data[0].codigo;
        respuestas.verificacion  = data[0].verificacion || 'registrado';
        respuestas.aviso_registro = data[0].aviso || null;

        // Correo de bienvenida (público, seguro de enviar desde el navegador)
        try{
          /* La plantilla u9x5p1i es genérica: el diseño vive allá y el texto
             viaja como variables, porque el plan gratuito de EmailJS solo
             permite 2 plantillas y las dos están ocupadas. Las variables
             viejas (carnet_url, mensaje_extra) se siguen mandando para que
             este correo funcione igual con la plantilla anterior mientras se
             cambia: así el push y la edición de la plantilla no tienen que
             ocurrir en el mismo minuto. */
          const enRevision = respuestas.verificacion === 'en_revision';
          const urlCarnet = location.origin + '/mi-mascota';
          await emailjs.send('service_ch7ncxl', 'template_u9x5p1i', {
            to_email: respuestas.correo,
            to_name: respuestas.nombre,
            codigo: respuestas.codigo_socio,
            mascota: respuestas.mascota,
            carnet_url: urlCarnet,
            boton_url: urlCarnet,

            /* Este asunto es EXACTAMENTE el que estaba escrito en la plantilla
               antes de hacerla genérica, emoji incluido. No es lugar para
               mejorarlo: el correo de bienvenida ya funciona y se ve así. */
            asunto: '¡Bienvenido al club, ' + respuestas.nombre
                  + '! Este es el carnet de ' + respuestas.mascota + ' 🐾',
            eyebrow: 'Ya eres parte del club',
            titulo: '¡Bienvenido, ' + respuestas.nombre + '!',
            intro: respuestas.mascota + ' ya tiene su carnet. Desde hoy los dos son parte de '
                 + 'Mi Mascota Club, y el carnet es lo único que necesitan para usar los '
                 + 'beneficios en los negocios adheridos.',
            caja_titulo: 'Código de socio de ' + respuestas.mascota,
            caja_dato: respuestas.codigo_socio,
            boton_texto: 'Ver mi carnet →',
            caja_nota: 'Guarda ese enlace en tu teléfono. Entras con tu correo y un código de 6 dígitos.',

            /* El correo dice lo mismo que la pantalla final: si falta verificar,
               este es el segundo recordatorio y llega cuando ya cerró el sitio.
               Después van el grupo y el pase de fundador, como texto dentro de
               mensaje_extra y NO como variables nuevas: así funcionan hoy con la
               plantilla tal como está, sin tener que editarla en EmailJS. Los
               enlaces se escriben completos porque los clientes de correo los
               vuelven clicables solos. */
            mensaje_extra: (enRevision
                ? 'Estamos revisando la cartilla de ' + respuestas.mascota + ': dentro de 48 horas hábiles queda verificada y tu carnet empieza a canjear beneficios. Te avisamos por correo apenas esté listo.'
                : 'Falta un paso para canjear beneficios: verificar que ' + respuestas.mascota + ' es tu mascota, con su número de chip y una foto de la cartilla veterinaria. Toma un minuto y se hace desde el mismo carnet, en Mi Mascota ID.')
              + '\n\n'
              + 'El grupo del club, solo para socios: acá nos recomendamos veterinarias, peluquerías y todo lo que necesitamos para ellos. '
              + 'https://chat.whatsapp.com/FMw6QHmwkSnFXIYbX5Cosb'
              + '\n\n'
              + '¿Quieres ser uno de los 100 Socios Fundadores? $9.990 por una vez: tu número del #001 al #100 en el carnet, tus recomendaciones de negocios visitadas primero y precio congelado de por vida. '
              + 'https://mimascotaclub.cl/quienes-somos#fundador'
          });
        } catch(emailErr){
          console.warn('El registro se guardó, pero el correo de bienvenida falló:', emailErr);
        }

        avanzar();
      } catch(e){
        alert('Error de conexión al registrar: ' + e.message);
        btn.textContent = 'Confirmar registro';
        btn.classList.add('activo');
      }
    });
  }

  btnVolver.classList.add('visible');
  btnVolver.textContent = index > 0 ? '← Atrás' : '← Volver al inicio';
  progresoBar.style.width = ((index+1)/preguntas.length*100) + '%';
  progresoTexto.textContent = `${index+1} / ${preguntas.length}`;

  return div;
}

function avanzar(){
  const actualDiv = stage.querySelector('.paso.activo');
  if(actualDiv) actualDiv.classList.add('saliendo');
  pasoActual++;
  if(pasoActual >= preguntas.length){
    setTimeout(mostrarFinal, 400);
    return;
  }
  const nuevo = renderPaso(pasoActual, 1);
  setTimeout(()=>{ if(actualDiv) actualDiv.remove(); }, 460);
}

function retroceder(){
  if(pasoActual===0){
    window.location.href = 'index.html';
    return;
  }
  const actualDiv = stage.querySelector('.paso.activo');
  if(actualDiv) actualDiv.classList.add('saliendo');
  pasoActual--;
  const nuevo = renderPaso(pasoActual, -1);
  setTimeout(()=>{ if(actualDiv) actualDiv.remove(); }, 460);
}

btnVolver.addEventListener('click', retroceder);

function mostrarFinal(){
  // Chequeo silencioso de bot: si el campo invisible tiene texto, no era humano.
  const honeypot = document.getElementById('honeypot');
  if(honeypot && honeypot.value){
    console.warn('Registro descartado (honeypot activado).');
    return;
  }
  progresoBar.style.width = '100%';
  progresoTexto.style.opacity = 0;
  btnVolver.classList.remove('visible');

  const codigo = respuestas.codigo_socio || '';
  const raza = [respuestas.especie, respuestas.raza].filter(Boolean).join(' · ');

  /* El carnet no miente sobre lo que puede hacer. Si la mascota todavía no está
     verificada, se dice acá — en el momento en que el socio está mirando el
     carnet recién hecho y le importa — y no en el mesón del negocio, que es
     donde un "no puedes canjear" arruina la visita para los dos. */
  const mascotaNom  = respuestas.mascota || 'tu mascota';
  const enRevision  = respuestas.verificacion === 'en_revision';
  const estadoTxt   = enRevision ? 'En revisión' : 'Falta verificar';
  const estadoColor = enRevision ? '#FFCE00' : '#FF9F43';

  const bloqueVerif = enRevision
    ? `<div class="verif-aviso">
         <b style="color:#fff;">Estamos revisando la cartilla de ${mascotaNom}.</b><br>
         Dentro de 48 horas hábiles queda verificada y tu carnet empieza a canjear beneficios.
         Te avisamos por correo apenas esté lista.
       </div>`
    : `<div class="verif-aviso">
         <b style="color:#fff;">Falta un paso: verificar a ${mascotaNom}.</b><br>
         Tu carnet ya existe, pero para canjear beneficios necesitamos confirmar que
         ${mascotaNom} es tu mascota. Toma un minuto: su número de chip y una foto de la cartilla veterinaria.
       </div>
       <a href="/mi-mascota" class="verif-cta">Verificar a ${mascotaNom} ahora</a>`;

  const bloqueAviso = respuestas.aviso_registro
    ? `<div class="verif-aviso">${respuestas.aviso_registro}</div>`
    : '';

  /* Dos bloques que van DESPUÉS del carnet y de la verificación, nunca antes:
     la inscripción ya terminó y nada de esto puede entorpecerla. Son enlaces
     simples, sin lógica ni llamadas: aunque fallaran, el registro ya está
     guardado y el carnet ya existe.
       · El grupo de WhatsApp es solo para socios, y por eso su enlace aparece
         recién acá y en el correo — nunca en el sitio público.
       · El pase de fundador se ofrece en el mejor momento posible: cuando la
         persona acaba de decir que sí. Lleva a /quienes-somos y no directo al
         pago, para que primero lea qué incluye. */
  const bloqueGrupo = `
      <div class="final-extra">
        <div class="final-extra__t">💬 El grupo del club</div>
        <p>Solo para socios. Acá nos recomendamos veterinarias, peluquerías y todo lo que necesitamos para ellos.</p>
        <a href="https://chat.whatsapp.com/FMw6QHmwkSnFXIYbX5Cosb" target="_blank" rel="noopener" class="final-extra__btn">Unirme al grupo</a>
      </div>`;

  const bloqueFundador = `
      <div class="final-extra final-extra--fundador">
        <div class="final-extra__t">★ Sé uno de los 100 fundadores</div>
        <p>$9.990 por una vez. Tu número del #001 al #100 en el carnet de ${mascotaNom}, tus recomendaciones de negocios visitadas primero y precio congelado de por vida.</p>
        <a href="/quienes-somos#fundador" class="final-extra__btn final-extra__btn--amarillo">Quiero mi número</a>
      </div>`;

  const div = document.createElement('div');
  div.className = 'paso';
  div.innerHTML = `
    <div class="paso-inner" style="text-align:center;">
      <div class="final-check"><svg viewBox="0 0 24 24" fill="none"><path d="M5 13l4 4L19 7" stroke="#151515" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
      <h1 class="pregunta">¡Bienvenido al club, ${respuestas.nombre.split(' ')[0]}!</h1>
      <p style="color:rgba(255,255,255,0.6); font-size:15px;">Este es el carnet de ${respuestas.mascota}. También te lo enviamos a ${respuestas.correo}.</p>

      <div class="carnet">
        <div class="carnet-badge">MIEMBRO FREE</div>
        <div class="carnet-top">
          <div class="carnet-marca">MI MASCOTA CLUB</div>
          <div class="carnet-id">${codigo || '—'}</div>
        </div>
        <div class="carnet-nombre">${respuestas.mascota}</div>
        <div class="carnet-raza">${raza}</div>
        <div class="carnet-qr" id="carnetQR"></div>
        <div class="carnet-pie">
          <div>Socio<b>${codigo || '—'}</b></div>
          <div style="text-align:right;">Estado<b style="color:${estadoColor};">${estadoTxt}</b></div>
        </div>
      </div>

      ${bloqueAviso}
      ${bloqueVerif}

      <p class="carnet-ayuda">
        <b style="color:#fff;">Cómo se usa:</b> en el negocio muestras este QR, ellos lo escanean con
        la cámara de su celular y confirman tu visita. Ahí mismo te aplican el beneficio y a los dos
        les queda el registro.
      </p>

      ${bloqueGrupo}
      ${bloqueFundador}

      <a href="/mi-mascota" class="btn-ir-inicio">Ver mi carnet cuando quiera</a>
      <div><a href="https://mimascotaclub.cl" class="btn-secundario">Explorar los beneficios</a></div>
    </div>
  `;
  stage.appendChild(div);
  requestAnimationFrame(()=> div.classList.add('activo'));

  // El QR lleva la URL de validación, no el código pelado: así el negocio lo
  // escanea con la cámara que ya trae su teléfono y aterriza en la pantalla
  // correcta, sin apps ni lectores raros.
  if(codigo){
    const caja = document.getElementById('carnetQR');
    try{
      if(typeof QRCode !== 'undefined'){
        new QRCode(caja, {
          text: location.origin + '/validar/' + encodeURIComponent(codigo),
          width:132, height:132, correctLevel: QRCode.CorrectLevel.M
        });
      }else{
        caja.innerHTML = '<div style="font-family:monospace;font-size:13px;color:#151515;font-weight:700;">' + codigo + '</div>';
      }
    }catch(e){
      caja.innerHTML = '<div style="font-family:monospace;font-size:13px;color:#151515;font-weight:700;">' + codigo + '</div>';
    }
  }
}


// arranque
renderPaso(0, 1);
</script>
<!-- Visor de la cartilla. Va suelto al final para que se superponga a los
     pasos del formulario sin heredar su transform ni su overflow. -->
<div id="lupaCartilla" class="lupa" onclick="cerrarLupa()">
  <button type="button" class="lupa__cerrar" onclick="cerrarLupa()">✕ Cerrar</button>
  <img id="lupaCartillaImg" alt="" onclick="zoomLupa(event)">
  <div class="lupa__ayuda">Toca la imagen para verla a tamaño real</div>
</div>

</body>
</html>
