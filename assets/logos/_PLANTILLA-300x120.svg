<svg xmlns="http://www.w3.org/2000/svg" width="300" height="120" viewBox="0 0 300 120" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <!-- ============================================================
       Mi Mascota Club — Plantilla para logos de la cinta de portada
       Lienzo: 300 x 120 px (proporción 5:2)
       Zona segura: 280 x 100 px (10 px de aire por lado)

       Compón el logo dentro de la zona segura y exporta:
         · SVG con viewBox="0 0 300 120"
         · o PNG de 900 x 360 px, fondo transparente

       Un logo HORIZONTAL crece hasta los 280 px de ancho.
       Un logo CUADRADO crece hasta los 100 px de alto.
       En el sitio se ve a 150 x 60 px sobre un cuadro blanco.

       Borra estas guías antes de entregar el archivo.
       ============================================================ -->
  <rect x="0.5" y="0.5" width="299" height="119" fill="none" stroke="#D0D0D0" stroke-width="1"/>
  <rect x="10" y="10" width="280" height="100" fill="none" stroke="#47C9C9" stroke-width="1" stroke-dasharray="4 4"/>
  <line x1="150" y1="0" x2="150" y2="120" stroke="#47C9C9" stroke-width="0.5" stroke-dasharray="2 3"/>
  <line x1="0" y1="60" x2="300" y2="60" stroke="#47C9C9" stroke-width="0.5" stroke-dasharray="2 3"/>
  <text x="150" y="64" font-family="Helvetica,Arial,sans-serif" font-size="9" fill="#B0B0B0" text-anchor="middle">tu logo aquí — 300 × 120</text>
</svg>
